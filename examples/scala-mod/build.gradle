plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.2' apply false
}

subprojects {
    apply plugin: 'scala'
    apply plugin: 'net.fabricmc.fabric-loom'

    version = '1.0.0'
    group = 'example'

    repositories {
        // The revival build publishes here for verification; published releases use Fabric Maven.
        maven { url = rootProject.file('../../build/repo') }
        mavenCentral()
    }

    scala {
        scalaVersion = rootProject.scala_version
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    loom {
        splitEnvironmentSourceSets()
        mods {
            register(project.name.replace('-', '_')) {
                sourceSet sourceSets.main
                sourceSet sourceSets.client
            }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
        implementation "net.fabricmc:fabric-language-scala:${rootProject.language_module_version}"
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
    }
    tasks.withType(ScalaCompile).configureEach {
        scalaCompileOptions.additionalParameters = ['-release:25']
    }

    processResources {
        def properties = [language_module_version: rootProject.language_module_version,
                          loader_version: rootProject.loader_version,
                          minecraft_version: rootProject.minecraft_version]
        inputs.properties(properties)
        filesMatching('fabric.mod.json') {
            expand(properties)
        }
    }
}
