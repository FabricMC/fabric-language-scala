name: Update Scala
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'
permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/setup-gradle@v6
      - name: Update aligned Scala and module versions
        run: ./gradlew updateVersions --warning-mode fail
      - name: Regenerate versioned examples
        run: ./gradlew processMDTemplates --warning-mode fail
      - name: Verify proposed update
        run: ./gradlew build publishMods --warning-mode fail --stacktrace
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: update-scala
          title: Update Scala runtime
          commit-message: Update Scala runtime and module version
          body: Updates both Scala runtime artifacts together, advances the module version, and regenerates the README and consumer versions. Build, adapter, packaging, and consumer checks run before this PR is opened. Run the production launch checks before merging; updates are never published automatically.
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
